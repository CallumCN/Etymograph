# Builds the TSX app in web/ and copies its output over the repo root, so
# it's the site's landing page at "/". This overwrites index.html in the
# deployed build artifact only — the legacy file stays tracked in git,
# just no longer reachable on the live site. auth.html is untouched and
# still serves as the shared sign-in page.
[build]
  command = "cd web && npm install && npm run build && cp -r dist/. ../"
  publish = "."
